name: 发布扩展商店

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 已生成安装包的 GitHub Release 标签，例如 1.5.37
        required: true
        type: string
      stores:
        description: 提交的扩展商店
        type: choice
        default: all
        options:
          - all
          - chrome
          - firefox
      dry_run:
        description: 仅验证凭据，不上传安装包或提交审核
        type: boolean
        default: true
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      stores:
        type: string
        default: all
      dry_run:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  submit:
    name: 提交 ${{ matrix.store }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        store: ${{ fromJSON(inputs.stores == 'chrome' && '["chrome"]' || inputs.stores == 'firefox' && '["firefox"]' || '["chrome", "firefox"]') }}
    concurrency:
      group: publish-store-${{ github.repository }}-${{ matrix.store }}
      cancel-in-progress: false
    env:
      STORE: ${{ matrix.store }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - name: 检出发布工具配置
        uses: actions/checkout@v7

      - name: 设置 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: 安装依赖
        run: npm install --ignore-scripts

      - name: 下载 Release 安装包
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          patterns=(--pattern "*-$STORE.zip")
          if [[ "$STORE" == 'firefox' ]]; then
            patterns+=(--pattern '*-sources.zip')
          fi
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir .output \
            "${patterns[@]}"

      - name: 验证凭据并提交商店
        env:
          CHROME_API_VERSION: v2
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
          CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
          FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
          FIREFOX_CHANNEL: listed
        run: |
          if [[ "$STORE" == 'chrome' ]]; then
            required=(CHROME_EXTENSION_ID CHROME_PUBLISHER_ID CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL CHROME_SERVICE_ACCOUNT_PRIVATE_KEY)
          else
            required=(FIREFOX_EXTENSION_ID FIREFOX_JWT_ISSUER FIREFOX_JWT_SECRET)
          fi
          for key in "${required[@]}"; do
            if [[ -z "${!key}" ]]; then
              echo "::error::缺少 GitHub Secret：$key"
              exit 1
            fi
          done

          shopt -s nullglob
          zips=(.output/*-"$STORE".zip)
          if [[ ${#zips[@]} -ne 1 ]]; then
            echo "::error::Release 中必须有且只有一个 $STORE 安装包"
            exit 1
          fi
          args=("--$STORE-zip" "${zips[0]}")
          if [[ "$STORE" == 'firefox' ]]; then
            sources=(.output/*-sources.zip)
            if [[ ${#sources[@]} -ne 1 ]]; then
              echo '::error::Release 中必须有且只有一个 Firefox 源码包'
              exit 1
            fi
            args+=(--firefox-sources-zip "${sources[0]}")
          fi
          if [[ "$DRY_RUN" == 'true' ]]; then
            args+=(--dry-run)
          fi
          npm run submit -- "${args[@]}"
