name: Check and Create Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  check-release:
    if: github.repository == 'anghunk/linuxdo-scripts'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      created: ${{ steps.compare_versions.outputs.created }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Get package.json version
        id: get_version
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> "$GITHUB_ENV"
          echo "version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Get latest release version
        id: get_release
        run: |
          curl -s https://api.github.com/repos/${{ github.repository }}/releases/latest | jq -r '.tag_name' > latest_release.txt

      - name: Compare versions
        id: compare_versions
        run: |
          if [ "$(cat latest_release.txt)" != "$PACKAGE_VERSION" ]; then
            echo "Version mismatch"
            echo "create_release=true" >> $GITHUB_ENV
            echo "created=true" >> "$GITHUB_OUTPUT"
          else
            echo "Version matches"
            echo "create_release=false" >> $GITHUB_ENV
            echo "created=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and package extensions
        if: env.create_release == 'true'
        run: |
          npm run build
          npm run zip
          npm run zip:firefox

      - name: Create new release
        if: env.create_release == 'true'
        run: |
          CURRENT_DATE=$(TZ='Asia/Shanghai' date +'%Y-%m-%d  %H:%M')
          sed -i "s/\$PACKAGE_VERSION/$PACKAGE_VERSION/g" CHANGELOG.md
          sed -i "s/\$CURRENT_DATE/$CURRENT_DATE/g" CHANGELOG.md
          gh release create "$PACKAGE_VERSION" \
          --generate-notes \
          -t "$PACKAGE_VERSION" \
          -n "$(cat CHANGELOG.md)

          ---

          使用方法:  
          | 浏览器                          | 安装链接                                                                                      | 备注     |
          | ------------------------------- | --------------------------------------------------------------------------------------------- | -------- |
          | **Chrome / Edge / Arc / Brave** | [Chrome Web Store](https://chromewebstore.google.com/detail/fbgblmjbeebanackldpbmpacppflgmlj) | 推荐     |
          | **Firefox**                     | [Firefox Addons](https://addons.mozilla.org/zh-CN/firefox/addon/linux_do-scripts/)            | 推荐     |
          | **国内用户**                    | [Crx 商店](https://www.crxsoso.com/webstore/detail/fbgblmjbeebanackldpbmpacppflgmlj)          | 无需翻墙 |

          发布于：$CURRENT_DATE" \
          .output/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.ACCESS_TOKEN }}

  publish-stores:
    needs: check-release
    if: >-
      needs.check-release.outputs.created == 'true' &&
      contains(fromJSON('["chrome", "firefox", "all"]'), vars.PUBLISH_STORES)
    permissions:
      contents: read
    uses: ./.github/workflows/publish_stores.yml
    with:
      release_tag: ${{ needs.check-release.outputs.version }}
      stores: ${{ vars.PUBLISH_STORES }}
      dry_run: false
    secrets: inherit
